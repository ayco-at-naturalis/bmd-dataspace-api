image: eclipse-temurin:25-jdk

variables:
  # Version of docker-dind and docker-cli-extras image
  DIND_VERSION: 28.4.0
  # HC Vault
  SERVICE_NAME: bmd
  SERVICE_DOMAIN: bii
  VAULT_AUTH_ROLE: "jwt-${SERVICE_NAME}"
  VAULT_SERVER_URL: "https://vault.naturalis.io"
  VAULT_PATH: "${SERVICE_DOMAIN}/${SERVICE_NAME}"
  TRIVY_DB_REPOSITORY: "aquasec/trivy-db:2"

.job_id_tokens: &job_id_tokens
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://${CI_SERVER_HOST}

stages:
  - "Secret Detection"
  - "Maven Build"
  - "Create Image"
  - "Trivy Scan"
  - "Tag Image"
  - "Deploy"
  - "Publish Javadocs"

cache:
  key: ${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}
  paths:
    - docker/mvn-repo

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

secret_detection:
  extends: .secret-analyzer
  stage: "Secret Detection"
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
    SECRET_DETECTION_REPORT_FILE: "gl-secret-detection-report.json"
  artifacts:
    reports:
      secret_detection: $SECRET_DETECTION_REPORT_FILE
    expire_in: 7 days
  allow_failure: false
  before_script:
    - apk add --no-cache jq
  script:
    - /analyzer run
    - |
      if [ -f "$SECRET_DETECTION_REPORT_FILE" ]; then
        if [ "$(jq ".vulnerabilities | length" $SECRET_DETECTION_REPORT_FILE)" -gt 0 ]; then
          echo "Vulnerabilities detected!"
          echo "Please check the $SECRET_DETECTION_REPORT_FILE security file."
          echo "Or run gitleak locally on your repository."
          exit 1
        fi
      else
        echo "Artifact $SECRET_DETECTION_REPORT_FILE does not exist."
        echo "No evaluation can be performed."
      fi

maven_build:
  stage: "Maven Build"
  script:
    - build/mvn-install.sh
  artifacts:
    expire_in: 3 days
    paths:
      - build/dependencies

create_image:
  stage: "Create Image"
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - build/create-image.sh

trivy_scan:
  stage: "Trivy Scan"
  image:
    name: docker.io/aquasec/trivy:latest
    entrypoint: [""]
  cache:
    key: trivy-cache
    paths:
      - .trivy/
  before_script:
    - "wget --header \"PRIVATE-TOKEN: $TRIVYIGNORE_ACCESS_TOKEN\" \"https://gitlab.com/api/v4/projects/41791412/repository/files/trivyignore/raw?ref=main\" --output-document=.trivyignore"
    - trivy --version
    - mkdir -p .trivy
    - |
      if [ ! -f .trivy/db/trivy.db ] || [ $(find .trivy/ -name "trivy.db" -mtime +1 | grep "trivy.db") ]; then
          echo "Downloading the trivy db ...";
          rm -rf .trivy/db;
          trivy image --cache-dir .trivy/ --download-db-only --db-repository $TRIVY_DB_REPOSITORY;
      fi
  script:
    # GitLab-compatible report
    - >
      trivy image --cache-dir "$TRIVY_CACHE_DIR" --no-progress
      --username "$CI_REGISTRY_USER" --password "$CI_JOB_TOKEN"
      --scanners vuln
      --format template --template "@/contrib/gitlab.tpl"
      -o gl-container-scanning-report.json
      "${COMMIT_HASH_IMAGE}"
    # Hard-fail on HIGH/CRITICAL (after writing the report)
    - >
      trivy image --cache-dir "$TRIVY_CACHE_DIR" --no-progress
      --username "$CI_REGISTRY_USER" --password "$CI_JOB_TOKEN"
      --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL
      "${COMMIT_HASH_IMAGE}"
  artifacts:
    when: always
    # If we ever switch to GitLab Ultimate, this file will be picked up
    # by GitLab and used in a sexy security dashboard
    reports:
      container_scanning: gl-container-scanning-report.json
    paths:
      - gl-container-scanning-report.json
      - .trivy/
    expire_in: 7 days

tag_docker_image:
  stage: "Tag Image"
  image: registry.gitlab.com/naturalis/lib/docker-cli-extras:${DIND_VERSION}-cli
  services:
    - docker:${DIND_VERSION}-dind
  script:
    - build/tag-image.sh


deploy_development:
  <<: *job_id_tokens
  stage: Deploy
  image: registry.gitlab.com/naturalis/lib/alpine-bookworm-cicd-utils:bookworm
  variables:
    DEPLOY_HOST: dev
  before_script:
    - set -eu
  script:
    - ansible/get_vault_token.sh
    #- ansible/pull_vault_secrets.sh

publish_javadocs:
  # Publishes the javadocs to https://naturalis.gitlab.io/bii/bmd/bmd-dataspace-api/
  stage: "Publish Javadocs"
  script:
    - build/publish-javadocs.sh
  artifacts:
    paths:
      - public


