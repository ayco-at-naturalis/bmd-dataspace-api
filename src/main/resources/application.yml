server:
  port: 8080
  tomcat:
    accesslog:
      enabled: true
      directory: /proc/self/fd
      prefix: "1"
      suffix: ""
      file-date-format: ""
      rotate: false
      buffered: false
      pattern: '%a %l %u %t "%r" %s %b %D'

spring:
  mvc:
    problemdetails:
      enabled: true

app:
  graph:
    base-iri: "${GRAPH_BASE_IRI:urn:uuid:}"
    # NB When running inside a Docker container, the Jena data directory inside
    # the container will always be /data/bmd/jena. See docker-compose.yml. In that
    # the directory on the Docker host is variable, but it is volume-mapped to
    # /data/bmd/jena.
    jena-data-dir: "${JENA_DATA_DIR:/data/bmd/jena}"
