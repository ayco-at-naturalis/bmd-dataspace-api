# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

# container_scanning:
#   variables:
#     DOCKER_IMAGE: ...
#     DOCKER_USER: ...
#     DOCKER_PASSWORD: ...
image: eclipse-temurin:25-jdk
variables:
  SERVICE_NAME: bmd
  SERVICE_DOMAIN: bii
  VAULT_AUTH_ROLE: jwt-${SERVICE_NAME}
  VAULT_SERVER_URL: https://vault.naturalis.io
  VAULT_PATH: "${SERVICE_DOMAIN}/${SERVICE_NAME}"
  TRIVY_DB_REPOSITORY: aquasec/trivy-db:2
  MAVEN_OPTS: "-Dmaven.repo.local=./docker/mvn-repo --enable-native-access=ALL-UNNAMED"
  MAVEN_CLI_OPTS: "-B -V --no-transfer-progress"
  APP_IMAGE: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"
".job_id_tokens":
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://${CI_SERVER_HOST}
stages:
- test
cache:
  key: "${CI_PROJECT_NAME}-${CI_COMMIT_REF_SLUG}"
  paths:
  - docker/mvn-repo
include:
- template: Jobs/Container-Scanning.gitlab-ci.yml
secret_detection:
  extends: ".secret-analyzer"
  stage: Secret Detection
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: 'false'
    SECRET_DETECTION_REPORT_FILE: gl-secret-detection-report.json
  artifacts:
    reports:
      secret_detection: "$SECRET_DETECTION_REPORT_FILE"
    expire_in: 7 days
  allow_failure: false
  before_script:
  - apk add --no-cache jq
  script:
  - "/analyzer run"
  - |
    if [ -f "$SECRET_DETECTION_REPORT_FILE" ]; then
      if [ "$(jq ".vulnerabilities | length" $SECRET_DETECTION_REPORT_FILE)" -gt 0 ]; then
        echo "Vulnerabilities detected!"
        echo "Please check the $SECRET_DETECTION_REPORT_FILE security file."
        echo "Or run gitleak locally on your repository."
        exit 1
      fi
    else
      echo "Artifact $SECRET_DETECTION_REPORT_FILE does not exist."
      echo "No evaluation can be performed."
    fi
maven_build:
  stage: Maven Build
  script:
  - build/mvn-install.sh
  artifacts:
    expire_in: 3 days
    paths:
    - build/dependencies
create_image:
  stage: Create Image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint:
    - ''
  script:
  - "$CI_PROJECT_DIR/build/create-image.sh"
publish_javadocs:
  stage: Publish Javadocs
  script:
  - build/publish-javadocs.sh
  artifacts:
    paths:
    - public
