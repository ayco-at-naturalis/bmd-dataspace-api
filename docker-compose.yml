services:
  bmd-dataspace-api:
    image: "registry.gitlab.com/naturalis/bii/bmd/bmd-dataspace-api:${APP_IMAGE_TAG:?Missing APP_IMAGE_TAG}"
    container_name: bmd-dataspace-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - "${JENA_DATA_DIR:?Missing JENA_DATA_DIR}:/data/bmd/jena"
    env_file:
      - .env
