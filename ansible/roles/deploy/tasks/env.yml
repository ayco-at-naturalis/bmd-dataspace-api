---

# Read contents of .image-version, generated by set-image-version.sh, and expose
# as environment variable
- name: Read image version
  ansible.builtin.set_fact:
    IMAGE_VERSION: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/.image-version') | trim }}"

- name: Generate .env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_dir }}/.env"
    mode: "0600"